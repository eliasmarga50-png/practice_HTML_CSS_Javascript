<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lists</title>
</head>

<body>
    <!--unordered lists-->
    <ul>
        <li>Computer</li>
        <li>Laptop</li>
    </ul>

    <!--ordered lists-->
    <ol start="1">
        <li>Super Computer</li>
        <li>Mainframe Computer</li>
        <li>Mini Computer</li>
        <li>Micro Computer</li>
        <ul>
            <li>Desktop Computer</li>
            <li>Laptop Computer</li>
            <li>PalmTop Computer</li>
        </ul>
    </ol>
</body>


</html>
