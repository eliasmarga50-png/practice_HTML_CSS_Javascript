<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forms</title>
 
</head>

<body>
    <form>
        First Name: <input type="text" name="firstname" placeholder="your name..."><br/>

        Last Name: <input type="text" name="lastname" placeholder="your father name"><br/>
        Quantity: <input type="number" name="qty" min="10" max="100" placeholder="10-100"><br/>

        Price: <input type="number" name="price" placeholder="price"><br/>

        Password: <input type="password" name="pwd" placeholder="enter password"><br/>

        <label for="appoint">Choose your preferred appointment date: </label>
        <input type="date" name="appoint" min="2019-04-01" max="2020-04-30" placeholder="2020-02-23"><br/>

        <textarea name="comment" rows="5" cols="100" spellcheck=true>Tell us what you feel about this webpage</textarea><br/>

        <input type="radio" name="gender" value="male" checked="checked">Male<br/>
        <input type="radio" name="gender" value="female">Female<br/>

        <hr>

        <ul>
            <li><input type="checkbox" name="genre" value="spaghetti" checked="checked">SPagetti</li>
            <li><input type="checkbox" name="genre" value="pizza">Pizza</li>
            <li><input type="checkbox" name="genre" value="sandwich">Sandwich</li>
            <li><input type="checkbox" name="genre" value="Burger">Burger</li><br/>
        </ul>

        Select the fruits you like

        <select name="fruits" size="6" multiple="multiple">
            <option>Orange</option>
            <option>Apple</option>
            <option>Banana</option>
            <option selected="selected">Mango</option>
            <option selected="selected">Avocado</option>
            <option>PineApple</option>
            <option>papaya</option>
            <option>Strawberry</option>
        </select>





    </form>
</body>
