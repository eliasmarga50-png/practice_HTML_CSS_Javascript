<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Formatting using web languages</title>
    </head>
    <body>
        <p><abbr title="World Health Organization">WHO</abbr> reporting malaria is increasing<p>
            <br>
        Two <acronym title="North Atlantic Treaty organization">NATO</acronym> were killed in afgahanistan <br>

        <em>Emphasized text</em><br>
        <strong>Strong Text</strong><br>
        <dfn>Definition term</dfn><br>
        <code>Computer Code text</code><br>
        <samp>samp computer code</samp><br>
        <kbd>Keyword text</kbd><br>
        <var>Variable text</var><br>
        <cite>To show citation</cite><br>
        <blockquote>sample block quote text</blockquote>
    </body>
</html>
